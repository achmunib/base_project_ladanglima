services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            APP_URL: 'http://localhost:${APP_PORT:-80}'
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            VITE_PORT: '${VITE_PORT:-5173}'
            CHOKIDAR_USEPOLLING: '${CHOKIDAR_USEPOLLING:-false}'
            CHOKIDAR_INTERVAL: '${CHOKIDAR_INTERVAL:-500}'
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80 --no-reload'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - 'node_modules:/var/www/html/node_modules'
        networks:
            - sail
        depends_on: {}
networks:
    sail:
        driver: bridge
volumes:
    node_modules:
